<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' font-family='sans-serif' fill='%23f43f5e'>M</text></svg>">
  <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=M&background=f43f5e&color=fff&size=256">
  
  <title>M คลังสต๊อกสินค้า</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- เพิ่มระบบคลังข้อมูลขนาดใหญ่ (localForage) เพื่อแก้ปัญหาพื้นที่เก็บรูปภาพเต็ม -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: "" };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error.toString() };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-stone-50 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-red-200 max-w-sm w-full">
                <h1 className="text-lg font-bold text-red-600 mb-2">แอปเกิดข้อผิดพลาด 🚧</h1>
                <p className="text-sm text-stone-600 mb-4">ระบบหยุดทำงานชั่วคราวเนื่องจากข้อมูลขัดข้อง กรุณากดรีเฟรชเพื่อเริ่มต้นใหม่</p>
                <div className="bg-red-50 p-3 rounded-lg text-xs text-red-800 text-left overflow-auto mb-4 font-mono h-24">
                  {this.state.errorMessage}
                </div>
                <button onClick={() => window.location.reload()} className="w-full bg-red-500 text-white py-3 rounded-xl font-bold shadow-sm">
                  รีเฟรชหน้าจอ
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const IconPlus = ({ size = 24, className = "", strokeWidth = 2 }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
    const IconMinus = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>);
    const IconSearch = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
    const IconChevronDown = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>);
    const IconChevronUp = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6-6 6"/></svg>);
    const IconTrash2 = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>);
    const IconCopy = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>);
    const IconX = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
    const IconImagePlus = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><line x1="16" x2="22" y1="5" y2="5"/><line x1="19" x2="19" y1="2" y2="8"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>);
    const IconCheck = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>);
    const IconRefresh = ({ size = 24, className = "" }) => (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>);

    const SIZES = [90, 100, 110, 120, 130, 140, 150, 160, 170];
    const STORAGE_KEY = "products";

    function emptySizes() {
      const obj = {};
      SIZES.forEach((s) => (obj[s] = 0));
      return obj;
    }

    function resizeImageToDataUrl(file, maxW = 220, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("อ่านไฟล์ไม่สำเร็จ"));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error("โหลดรูปไม่สำเร็จ"));
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function totalOf(sizes) {
      return Object.values(sizes || {}).reduce((a, b) => a + (Number(b) || 0), 0);
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function StockManager() {
      const [products, setProducts] = useState([]);
      const [loaded, setLoaded] = useState(false);
      const [loadError, setLoadError] = useState(false);
      const [expanded, setExpanded] = useState(() => new Set());
      const [query, setQuery] = useState("");
      const [showForm, setShowForm] = useState(false);
      const [editingId, setEditingId] = useState(null);
      const [copiedStatus, setCopiedStatus] = useState({ id: null, type: null });
      const [confirmDeleteId, setConfirmDeleteId] = useState(null);
      
      const [showBackup, setShowBackup] = useState(false);
      const [backupText, setBackupText] = useState("");
      const [backupError, setBackupError] = useState("");

      const saveTimer = useRef(null);

      // โหลดข้อมูลด้วยระบบใหม่
      useEffect(() => {
        async function loadData() {
          try {
            // ดึงจากโกดังใหม่ (localforage)
            let saved = await localforage.getItem(STORAGE_KEY);
            
            // ถ้าระบบใหม่ยังว่างเปล่า ให้ไปดูดข้อมูล 19 แบบเก่า จากลิ้นชักเดิม (localStorage) มาใส่
            if (!saved) {
              const oldSaved = localStorage.getItem(STORAGE_KEY);
              if (oldSaved) {
                saved = JSON.parse(oldSaved);
                await localforage.setItem(STORAGE_KEY, saved); // ย้ายเข้าโกดังใหม่ทันที
              }
            }

            if (saved) {
              setProducts(typeof saved === 'string' ? JSON.parse(saved) : saved);
            }
          } catch (e) {
            console.error("โหลดข้อมูลไม่สำเร็จ", e);
          }
          setLoaded(true);
        }
        loadData();
      }, []);

      // บันทึกข้อมูลด้วยระบบใหม่
      useEffect(() => {
        if (!loaded) return;
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            await localforage.setItem(STORAGE_KEY, products);
            setLoadError(false);
          } catch (e) {
            console.error("Save error:", e);
            setLoadError(true);
          }
        }, 500);
        return () => clearTimeout(saveTimer.current);
      }, [products, loaded]);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        let list = products;
        if (q) list = list.filter((p) => String(p.sku || "").toLowerCase().includes(q) || (p.name && String(p.name).toLowerCase().includes(q)));
        return [...list].sort((a, b) => String(a.sku || "").localeCompare(String(b.sku || ""), "th"));
      }, [products, query]);

      const grandTotal = useMemo(() => products.reduce((sum, p) => sum + totalOf(p.sizes || {}), 0), [products]);

      function toggleExpand(id) {
        setExpanded((prev) => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      }

      function updateSize(id, size, value) {
        const n = Math.max(0, Number(value) || 0);
        setProducts((prev) => prev.map((p) => {
          if (p.id !== id) return p;
          const currentSizes = p.sizes || {};
          return { ...p, sizes: { ...currentSizes, [size]: n } };
        }));
      }

      function bumpSize(id, size, delta) {
        setProducts((prev) =>
          prev.map((p) => {
            if (p.id !== id) return p;
            const currentSizes = p.sizes || {};
            const cur = Number(currentSizes[size]) || 0;
            return { ...p, sizes: { ...currentSizes, [size]: Math.max(0, cur + delta) } };
          })
        );
      }

      function updateHighlight(id, color) {
        setProducts((prev) => prev.map((p) => (p.id === id ? { ...p, highlightColor: color } : p)));
      }

      function resetAllHighlights() {
        setProducts((prev) => prev.map((p) => ({ ...p, highlightColor: 'none' })));
      }

      function deleteProduct(id) {
        setProducts((prev) => prev.filter((p) => p.id !== id));
        setConfirmDeleteId(null);
      }

      function openAddForm() {
        setEditingId(null);
        setShowForm(true);
      }

      function openEditForm(id) {
        setEditingId(id);
        setShowForm(true);
      }

      function upsertProduct(data) {
        if (editingId) {
          setProducts((prev) => prev.map((p) => (p.id === editingId ? { ...p, ...data } : p)));
        } else {
          setProducts((prev) => [...prev, { id: uid(), ...data }]);
        }
        setShowForm(false);
        setEditingId(null);
      }

      async function copyToClipboard(text, id, type) {
        try {
          await navigator.clipboard.writeText(text);
          setCopiedStatus({ id, type });
          setTimeout(() => setCopiedStatus({ id: null, type: null }), 1500);
        } catch (e) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            setCopiedStatus({ id, type });
            setTimeout(() => setCopiedStatus({ id: null, type: null }), 1500);
        }
      }

      function copySummary(p) {
        const currentSizes = p.sizes || {};
        const lines = SIZES.filter((s) => (currentSizes[s] || 0) > 0).map((s) => `ไซส์ ${s}: เหลือ ${currentSizes[s]} ตัว`);
        const text = [
          p.name ? `ชื่อ: ${p.name}` : null,
          `SKU: ${p.sku || "-"}`,
          p.price ? `ราคา: ${p.price} บาท` : null,
          lines.length ? lines.join("\n") : "ขณะนี้ของหมดสต๊อกทุกไซส์",
        ].filter(Boolean).join("\n");
        
        copyToClipboard(text, p.id, 'summary');
      }

      function handleImportData() {
        try {
          const parsed = JSON.parse(backupText);
          if (Array.isArray(parsed)) {
            setProducts(parsed);
            setShowBackup(false);
          } else {
            setBackupError("ข้อมูลไม่ถูกต้อง (ต้องเป็นรายการสินค้า)");
          }
        } catch (e) {
          setBackupError("รูปแบบข้อมูลผิดพลาด กรุณาตรวจสอบให้แน่ใจว่าคัดลอกมาครบถ้วน");
        }
      }

      const bgColors = {
        blue: 'bg-blue-300 border-blue-500',
        green: 'bg-emerald-300 border-emerald-500',
        yellow: 'bg-amber-300 border-amber-500',
        none: 'bg-white border-stone-200'
      };

      const hasHighlightedProducts = products.some(p => p.highlightColor && p.highlightColor !== 'none');
      const editingProduct = editingId ? products.find((p) => p.id === editingId) : null;

      return (
        <div className="min-h-screen bg-stone-50 text-stone-800">
          <div className="max-w-2xl mx-auto px-4 pb-28 pt-5">
            <header className="mb-5">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-2.5">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-500 to-rose-600 text-white flex items-center justify-center font-bold text-2xl shadow-sm">
                    M
                  </div>
                  <div>
                    <h1 className="text-xl font-bold text-stone-900 tracking-tight">คลังสต๊อกสินค้า</h1>
                    <p className="text-sm text-stone-500 mt-0.5">
                      {products.length} แบบ · รวม {grandTotal.toLocaleString()} ตัว
                    </p>
                  </div>
                </div>
                <button
                  onClick={openAddForm}
                  className="flex items-center gap-1.5 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white font-medium rounded-full pl-3 pr-4 py-2.5 shadow-sm shadow-rose-200 transition-colors"
                >
                  <IconPlus size={18} strokeWidth={2.5} />
                  <span className="text-sm">เพิ่มแบบ</span>
                </button>
              </div>

              <div className="relative mt-4">
                <IconSearch size={17} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
                <input
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  placeholder="ค้นหาด้วยชื่อสินค้า หรือ SKU..."
                  className="w-full bg-white border border-stone-200 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none focus:ring-2 focus:ring-rose-300 focus:border-rose-300"
                />
              </div>

              <div className="flex items-center justify-between mt-3 px-1">
                <span className="text-xs font-medium text-stone-500">
                  {query ? `พบ ${filtered.length} รายการ` : `รายการทั้งหมด ${products.length} แบบ`}
                </span>
                
                {hasHighlightedProducts && (
                  <button
                    onClick={resetAllHighlights}
                    className="flex items-center gap-1 text-[11px] font-bold text-stone-600 hover:text-rose-500 bg-white border border-stone-200 hover:border-rose-300 rounded-lg px-2.5 py-1.5 shadow-sm transition-colors"
                  >
                    <IconRefresh size={12} /> รีเซ็ตสีทั้งหมด
                  </button>
                )}
              </div>

              {loadError && (
                <p className="text-xs text-amber-600 mt-2">⚠ พื้นที่เก็บข้อมูลเต็ม หรือเซฟไม่สำเร็จ</p>
              )}
            </header>

            {!loaded && <p className="text-center text-stone-400 text-sm py-10">กำลังโหลดข้อมูล...</p>}

            {loaded && filtered.length === 0 && (
              <div className="text-center py-16 px-6 bg-white rounded-2xl border border-dashed border-stone-300">
                <p className="text-stone-500 text-sm">
                  {products.length === 0 ? "ยังไม่มีแบบสินค้าในระบบ กดปุ่ม “เพิ่มแบบ” เพื่อเริ่มต้น" : "ไม่พบรายการที่ค้นหา"}
                </p>
              </div>
            )}

            <div className="space-y-3">
              {filtered.map((p) => {
                const pSizes = p.sizes || {};
                const total = totalOf(pSizes);
                const isExpanded = expanded.has(p.id);
                const visibleSizes = SIZES.filter((s) => (pSizes[s] || 0) > 0);
                
                const statusColor = total > 0 ? "bg-emerald-500" : "bg-red-400";
                const statusText = total > 0 ? "text-emerald-700" : "text-red-500";
                const statusLabel = total > 0 ? "มีสินค้า" : "ของหมด";
                
                const cardBg = bgColors[p.highlightColor || 'none'];

                return (
                  <div key={p.id} className={`rounded-2xl border overflow-hidden shadow-sm transition-colors duration-200 ${cardBg}`}>
                    <div
                      onClick={() => toggleExpand(p.id)}
                      className="w-full flex items-start gap-3 p-3 cursor-pointer"
                    >
                      {p.image ? (
                        <img src={p.image} alt={p.sku || ""} className="w-16 h-16 rounded-xl object-cover flex-shrink-0 border border-black/10 bg-white" />
                      ) : (
                        <div className="w-16 h-16 rounded-xl bg-black/5 border border-black/5 flex items-center justify-center flex-shrink-0 text-stone-400">
                          <IconImagePlus size={22} />
                        </div>
                      )}

                      <div className="flex-1 min-w-0">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-1.5">
                              <span className="font-bold text-stone-900 text-[15px] truncate leading-tight">
                                {p.name || p.sku || "-"}
                              </span>
                              {p.name && (
                                <button 
                                  onClick={(e) => { e.stopPropagation(); copyToClipboard(p.name, p.id, 'name'); }} 
                                  className="p-1 text-stone-500 bg-white/60 hover:bg-white hover:text-rose-500 rounded-md shadow-sm transition-colors flex-shrink-0"
                                  title="คัดลอกชื่อสินค้า"
                                >
                                  {copiedStatus.id === p.id && copiedStatus.type === 'name' ? <IconCheck size={14} className="text-emerald-600" /> : <IconCopy size={14} />}
                                </button>
                              )}
                            </div>
                            
                            {p.name && (
                              <div className="text-sm text-stone-700 mt-1 truncate font-medium">SKU: {p.sku || "-"}</div>
                            )}
                            
                            <div className="flex items-center gap-1.5 mt-1.5">
                              <span className={`w-1.5 h-1.5 rounded-full ${statusColor} flex-shrink-0`} />
                              <span className={`text-xs font-semibold ${statusText} bg-white/50 px-1.5 py-0.5 rounded`}>
                                {statusLabel} · รวม {total} ตัว
                              </span>
                            </div>
                          </div>

                          {p.price ? (
                            <span className="text-sm text-stone-900 font-bold flex-shrink-0 mt-0.5 bg-white/40 px-2 py-1 rounded-lg">
                              ฿{Number(p.price).toLocaleString()}
                            </span>
                          ) : null}
                        </div>
                      </div>

                      <div className="pt-1 pl-1">
                         {isExpanded ? <IconChevronUp size={20} className="text-stone-500" /> : <IconChevronDown size={20} className="text-stone-500" />}
                      </div>
                    </div>

                    {isExpanded && (
                      <div className="px-3 pb-3 border-t border-black/10 pt-2 bg-white/80">
                        {visibleSizes.length === 0 && (
                          <p className="text-sm text-stone-500 text-center py-3 font-medium">ของหมดสต๊อกในทุกไซส์ (กดแก้ไขเพื่อเพิ่มของ)</p>
                        )}
                        <div className="divide-y divide-black/10">
                          {visibleSizes.map((s) => (
                            <div key={s} className="flex items-center gap-3 py-2">
                              <span className="text-sm text-stone-800 font-bold w-16 flex-shrink-0">ไซส์ {s}</span>
                              <div className="flex items-center gap-2 ml-auto flex-shrink-0">
                                <button
                                  onClick={(e) => { e.stopPropagation(); bumpSize(p.id, s, -1); }}
                                  className="w-7 h-7 rounded-md bg-white border border-stone-200 flex items-center justify-center text-stone-600 active:bg-stone-100 flex-shrink-0 shadow-sm"
                                >
                                  <IconMinus size={14} />
                                </button>
                                <input
                                  type="number"
                                  value={pSizes[s] ?? 0}
                                  onChange={(e) => updateSize(p.id, s, e.target.value)}
                                  onClick={(e) => e.stopPropagation()}
                                  className="w-12 text-center text-sm font-bold text-stone-900 bg-transparent outline-none"
                                />
                                <button
                                  onClick={(e) => { e.stopPropagation(); bumpSize(p.id, s, 1); }}
                                  className="w-7 h-7 rounded-md bg-white border border-stone-200 flex items-center justify-center text-stone-600 active:bg-stone-100 flex-shrink-0 shadow-sm"
                                >
                                  <IconPlus size={14} />
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>

                        <div className="flex items-center flex-wrap gap-y-3 mt-4 pt-3 border-t border-black/10">
                          <div className="flex items-center gap-1.5 mr-auto bg-white/50 px-2 py-1.5 rounded-lg">
                            <span className="text-[11px] font-bold text-stone-600 mr-1">ป้ายสี:</span>
                            <button onClick={(e) => { e.stopPropagation(); updateHighlight(p.id, 'none'); }} className={`w-5 h-5 rounded-full border-2 ${!p.highlightColor || p.highlightColor === 'none' ? 'border-stone-500 bg-white' : 'border-transparent bg-stone-300'}`} />
                            <button onClick={(e) => { e.stopPropagation(); updateHighlight(p.id, 'blue'); }} className={`w-5 h-5 rounded-full border-2 ${p.highlightColor === 'blue' ? 'border-blue-700 bg-blue-500' : 'border-transparent bg-blue-400'}`} />
                            <button onClick={(e) => { e.stopPropagation(); updateHighlight(p.id, 'green'); }} className={`w-5 h-5 rounded-full border-2 ${p.highlightColor === 'green' ? 'border-emerald-700 bg-emerald-500' : 'border-transparent bg-emerald-400'}`} />
                            <button onClick={(e) => { e.stopPropagation(); updateHighlight(p.id, 'yellow'); }} className={`w-5 h-5 rounded-full border-2 ${p.highlightColor === 'yellow' ? 'border-amber-700 bg-amber-500' : 'border-transparent bg-amber-400'}`} />
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              onClick={(e) => { e.stopPropagation(); copySummary(p); }}
                              className="flex items-center gap-1 text-xs font-bold text-stone-700 bg-white border border-stone-200 hover:bg-stone-50 rounded-lg px-2.5 py-1.5 shadow-sm"
                            >
                              {copiedStatus.id === p.id && copiedStatus.type === 'summary' ? <IconCheck size={14} className="text-emerald-600" /> : <IconCopy size={14} />}
                              {copiedStatus.id === p.id && copiedStatus.type === 'summary' ? "คัดลอกแล้ว" : "สรุปยอด"}
                            </button>
                            <button
                              onClick={(e) => { e.stopPropagation(); openEditForm(p.id); }}
                              className="text-xs font-bold text-stone-700 bg-white border border-stone-200 hover:bg-stone-50 rounded-lg px-2.5 py-1.5 shadow-sm"
                            >
                              แก้ไข
                            </button>
                            {confirmDeleteId === p.id ? (
                              <button
                                onClick={(e) => { e.stopPropagation(); deleteProduct(p.id); }}
                                className="flex items-center gap-1 text-xs font-bold text-white bg-red-500 hover:bg-red-600 rounded-lg px-2.5 py-1.5 shadow-sm"
                              >
                                <IconTrash2 size={14} /> ยืนยันลบ
                              </button>
                            ) : (
                              <button
                                onClick={(e) => { e.stopPropagation(); setConfirmDeleteId(p.id); }}
                                onBlur={() => setTimeout(() => setConfirmDeleteId(null), 2000)}
                                className="flex items-center justify-center text-stone-500 hover:text-red-500 bg-white border border-stone-200 hover:bg-red-50 rounded-lg px-2.5 py-1.5 shadow-sm"
                              >
                                <IconTrash2 size={14} />
                              </button>
                            )}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="mt-8 text-center pb-6">
              <button 
                onClick={() => {
                  setBackupText(JSON.stringify(products, null, 2));
                  setBackupError("");
                  setShowBackup(true);
                }} 
                className="text-xs font-medium text-stone-400 hover:text-stone-600 underline"
              >
                สำรองข้อมูล / นำเข้าข้อมูลกลับ (Backup & Restore)
              </button>
            </div>
          </div>

          {showForm && (
            <ProductForm
              key={editingId || "new"}
              initial={editingProduct}
              onCancel={() => {
                setShowForm(false);
                setEditingId(null);
              }}
              onSave={upsertProduct}
            />
          )}

          {showBackup && (
            <div className="fixed inset-0 bg-black flex items-center justify-center z-[60] p-4">
              <div className="bg-white w-full max-w-md rounded-2xl flex flex-col shadow-2xl overflow-hidden">
                <div className="px-4 py-3 border-b border-stone-100 flex justify-between items-center bg-stone-50">
                  <h2 className="font-bold text-stone-800">จัดการข้อมูล (สำรอง / นำเข้า)</h2>
                  <button onClick={() => setShowBackup(false)} className="text-stone-400 hover:text-stone-600 p-1"><IconX size={20}/></button>
                </div>
                <div className="p-4 space-y-3">
                  <p className="text-xs text-stone-600 font-medium">
                    หากข้อมูลหายเพราะเปิดสลับเบราว์เซอร์ ให้กลับไปเปิดลิงก์ในแอปเดิมแล้วกด <span className="font-bold text-stone-800">"คัดลอกข้อมูล"</span> จากนั้นนำรหัสมาวางที่นี่แล้วกด <span className="font-bold text-rose-500">"นำเข้าข้อมูล"</span>
                  </p>
                  <textarea 
                    className="w-full h-40 bg-stone-50 border border-stone-200 rounded-xl p-3 text-[11px] font-mono text-stone-600 outline-none focus:ring-2 focus:ring-rose-300"
                    value={backupText}
                    onChange={(e) => setBackupText(e.target.value)}
                    placeholder="วางข้อมูลที่คัดลอกมาที่นี่..."
                  />
                  {backupError && <p className="text-xs font-medium text-red-500">{backupError}</p>}
                </div>
                <div className="p-4 border-t border-stone-100 flex gap-3">
                  <button onClick={() => copyToClipboard(backupText, 'backup', 'text')} className="flex-1 bg-stone-100 text-stone-700 py-2.5 rounded-xl text-sm font-bold hover:bg-stone-200 transition-colors">
                    คัดลอกข้อมูล
                  </button>
                  <button onClick={handleImportData} className="flex-1 bg-rose-500 text-white py-2.5 rounded-xl text-sm font-bold hover:bg-rose-600 shadow-sm transition-colors">
                    นำเข้าข้อมูล
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ProductForm({ initial, onCancel, onSave }) {
      const [sku, setSku] = useState(() => initial?.sku || "");
      const [name, setName] = useState(() => initial?.name || "");
      const [price, setPrice] = useState(() => initial?.price ?? "");
      const [image, setImage] = useState(() => initial?.image || null);
      const [sizes, setSizes] = useState(() => initial?.sizes || emptySizes());
      const [uploading, setUploading] = useState(false);
      const [error, setError] = useState("");

      const safeSizes = sizes || {};
      const totalCurrent = totalOf(safeSizes);

      async function handleFile(e) {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploading(true);
        try {
          const dataUrl = await resizeImageToDataUrl(file);
          setImage(dataUrl);
        } catch (err) {
          setError("อัปโหลดรูปไม่สำเร็จ ลองใหม่อีกครั้ง");
        }
        setUploading(false);
      }

      function handleSubmit() {
        if (!String(sku).trim()) {
          setError("กรุณาใส่ SKU");
          return;
        }
        onSave({
          sku: String(sku).trim(),
          name: String(name).trim(),
          price: price === "" ? "" : Number(price),
          image,
          sizes: safeSizes,
        });
      }

      return (
        <div className="fixed inset-0 bg-black flex items-end sm:items-center justify-center z-50 p-0 sm:p-4">
          <div className="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl flex flex-col shadow-2xl" style={{ maxHeight: "92vh" }}>
            <div className="flex items-center justify-between px-4 py-3 border-b border-stone-100 flex-shrink-0">
              <h2 className="font-bold text-stone-900">{initial ? "แก้ไขแบบสินค้า" : "เพิ่มแบบสินค้า"}</h2>
              <button onClick={onCancel} className="text-stone-400 hover:text-stone-600 p-1">
                <IconX size={20} />
              </button>
            </div>

            <div className="overflow-y-auto px-4 py-4 space-y-4">
              <div className="flex items-center gap-3">
                <label className="w-20 h-20 rounded-xl bg-stone-50 border border-dashed border-stone-300 flex items-center justify-center flex-shrink-0 overflow-hidden cursor-pointer active:bg-stone-100">
                  {image ? (
                    <img src={image} alt="" className="w-full h-full object-cover" />
                  ) : uploading ? (
                    <span className="text-[10px] text-stone-400">กำลังโหลด...</span>
                  ) : (
                    <IconImagePlus size={22} className="text-stone-300" />
                  )}
                  <input type="file" accept="image/*" className="hidden" onChange={handleFile} />
                </label>
                <div className="flex-1 space-y-2">
                  <div>
                    <label className="text-xs text-stone-500 font-bold">SKU (รหัสสินค้า)</label>
                    <input
                      value={sku}
                      onChange={(e) => setSku(e.target.value)}
                      placeholder="เช่น 690211"
                      className="w-full mt-0.5 bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-rose-300"
                    />
                  </div>
                </div>
              </div>

              <div>
                <label className="text-xs text-stone-500 font-bold">ชื่อสินค้า (ถ้ามี)</label>
                <input
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="เช่น เสื้อยืดคอกลมสีขาว"
                  className="w-full mt-0.5 bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-rose-300"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="text-xs text-stone-500 font-bold">ราคา (บาท)</label>
                  <input
                    type="number"
                    value={price ?? ""}
                    onChange={(e) => setPrice(e.target.value)}
                    placeholder="0"
                    className="w-full mt-0.5 bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-2 text-sm font-semibold outline-none focus:ring-2 focus:ring-rose-300"
                  />
                </div>
                <div>
                  <label className="text-xs text-stone-500 font-bold">จำนวนรวมทั้งหมด (ตัว)</label>
                  <div className="w-full mt-0.5 bg-stone-100/50 border border-transparent rounded-lg px-2.5 py-2 text-sm text-stone-700 font-bold flex items-center">
                    {totalCurrent}
                  </div>
                </div>
              </div>

              <div>
                <label className="text-xs text-stone-500 font-bold mb-1 block">จำนวนแต่ละไซส์</label>
                <div className="bg-stone-50 rounded-lg border border-stone-100 divide-y divide-stone-200 px-3">
                  {SIZES.map((s) => (
                    <div key={s} className="flex items-center justify-between py-2">
                      <span className="text-sm text-stone-700 font-bold">ไซส์ {s}</span>
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => setSizes((prev) => ({ ...(prev || {}), [s]: Math.max(0, (Number((prev || {})[s]) || 0) - 1) }))}
                          className="w-7 h-7 rounded-md bg-white border border-stone-200 flex items-center justify-center text-stone-600 active:bg-stone-100 shadow-sm"
                        >
                          <IconMinus size={14} />
                        </button>
                        <input
                          type="number"
                          value={safeSizes[s] !== undefined ? safeSizes[s] : 0}
                          onChange={(e) => setSizes((prev) => ({ ...(prev || {}), [s]: Math.max(0, Number(e.target.value) || 0) }))}
                          className="w-12 text-center text-sm font-bold bg-transparent outline-none"
                        />
                        <button
                          type="button"
                          onClick={() => setSizes((prev) => ({ ...(prev || {}), [s]: Math.max(0, (Number((prev || {})[s]) || 0) + 1) }))}
                          className="w-7 h-7 rounded-md bg-white border border-stone-200 flex items-center justify-center text-stone-600 active:bg-stone-100 shadow-sm"
                        >
                          <IconPlus size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {error && <p className="text-xs font-bold text-red-500">{error}</p>}
            </div>

            <div className="p-4 border-t border-stone-100 flex-shrink-0">
              <button
                onClick={handleSubmit}
                className="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl py-3 text-sm shadow-sm shadow-rose-200 transition-colors"
              >
                {initial ? "บันทึกการแก้ไข" : "เพิ่มลงคลัง"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <StockManager />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
